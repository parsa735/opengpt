server:
  port: 5080
  address: 127.0.0.1

spring:
  main:
    web-application-type: servlet
  application:
    name: opengpt

adapter:
  storage-path: ${user.home}/.opengpt/auth.json
  # Main app URL shown in the UI (OAuth callback stays on :1455)
  public-base-url: http://localhost:5080
  # Plain Cursor ↔ Codex request/response dump for lab debugging
  traffic-log-path: ${user.home}/.opengpt/traffic.log

openai:
  oauth:
    client-id: app_EMoamEEZ73f0CkXaXp7hrann
    issuer: https://auth.openai.com
    # Registered redirect_uri for the Codex OAuth client (do not change to the API port)
    callback-url: http://localhost:1455/auth/callback
    callback-port: 1455
    scope: openid profile email offline_access
    originator: opencode

codex:
  endpoint: https://chatgpt.com/backend-api/codex/responses
  user-agent: opengpt
  originator: opengpt

logging:
  level:
    root: INFO
    com.opengpt: INFO
